- name: Admin - Dashboard
  description: Administrative metrics and overview statistics.
- name: Admin - Users
  description: Platform user management and status controls.
- name: Admin - Verification
  description: KYC audit, approval, rejection, suspension, and expiry processing.
- name: Admin - Complaints
  description: Dispute resolution and complaint moderation.
- name: Admin - Reviews
  description: Review moderation and report handling.
