          description: Validation error (missing documents or invalid status)
        '401':
          description: Authentication required
        '403':
          description: Professional role required
  /api/v1/worker/bookings/:
    get:
      operationId: list_worker_bookings
      description: Returns a list of bookings assigned to or pending for the logged-in
        professional worker.
      summary: List Worker Bookings
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: section
        schema:
          type: string
        description: 'Filter by workspace section: pending, assigned, or history'
      - in: query
        name: status
        schema:
          type: string
        description: Filter by specific booking status string
      tags:
      - Worker Operations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkerBookingList'
          description: ''
  /api/v1/worker/bookings/{booking_number}/accept/:
    post:
      operationId: worker_accept_booking
      description: Professional worker accepts a newly assigned pending booking request.
      summary: Accept Assigned Booking
      parameters:
      - in: path
        name: booking_number
        schema:
          type: string
        required: true
      tags:
      - Worker Operations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Booking accepted successfully
        '400':
          description: Booking cannot be accepted
        '404':
          description: Booking not found
  /api/v1/worker/bookings/{booking_number}/reject/:
    post:
      operationId: worker_reject_booking
      description: Worker rejects an assigned pending booking request, returning it
        to assignment pool.
      summary: Reject Assigned Booking
      parameters:
      - in: path
        name: booking_number
        schema:
          type: string
        required: true
      tags:
      - Worker Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRejectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkerRejectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkerRejectRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Booking rejected successfully
        '400':
          description: Booking cannot be rejected
        '404':
          description: Booking not found
  /api/v1/worker/bookings/{booking_number}/update-status/:
    post:
      operationId: worker_update_booking_status
      description: Transitions status of a booking assigned to the worker (e.g. on_the_way,
        arrived, started, in_progress, completed).
      summary: Update Booking Execution Status
      parameters:
      - in: path
        name: booking_number
        schema:
          type: string
        required: true
      tags:
      - Worker Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerStatusUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkerStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkerStatusUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Status updated successfully
        '400':
          description: Invalid status transition
        '404':
          description: Booking not found
  /api/v1/worker/trust-score/:
    get:
      operationId: get_my_trust_score
      description: Returns the deterministic Trust Score, badge tier, and breakdown
        signals for the authenticated worker.
      summary: Retrieve My Trust Score
      tags:
      - Worker Operations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustScoreResponse'
          description: ''
