openapi: 3.0.3
info:
  title: LocalHub REST API
  version: 1.0.0
  description: Comprehensive REST API documentation for LocalHub platform (Phase 1–3
    Trust & Safety, Accounts, Services, Bookings, Reviews, Verification, and Admin
    Operations).
paths:
  /api/v1/accounts/addresses/:
    get:
      operationId: list_user_addresses
      description: Returns all active addresses saved in the authenticated customer's
        address book.
      summary: List Customer Addresses
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: create_user_address
      description: Adds a new address to the authenticated customer's address book.
      summary: Create Customer Address
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/accounts/addresses/{id}/:
    get:
      operationId: retrieve_user_address
      description: Returns detailed information for a specific address.
      summary: Retrieve Address Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: update_user_address
      description: Updates all fields of an existing address.
      summary: Update Address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: partial_update_user_address
      description: Updates specific fields of an existing address.
      summary: Partial Update Address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: delete_user_address
      description: Soft-deletes an address from the authenticated customer's address
        book.
      summary: Delete Address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/become-pro/healthcare/:
    post:
      operationId: become_healthcare_pro
      description: Registers credentials for doctors, nurses, physiotherapists, and
        clinical specialists.
      summary: Onboard as Healthcare Professional
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BecomeHealthcareProRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BecomeHealthcareProRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BecomeHealthcareProRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          description: Healthcare professional application submitted
  /api/v1/accounts/become-pro/individual/:
    post:
      operationId: become_individual_pro
      description: Upgrades customer account into a verified individual service professional
        (Cleaner, Electrician, Plumber, etc.).
      summary: Onboard as Individual Professional
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BecomeIndividualProRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BecomeIndividualProRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BecomeIndividualProRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          description: Professional profile and verification submitted
  /api/v1/accounts/become-pro/organization/:
    post:
      operationId: become_organization
      description: Registers a clinic, hospital, diagnostic center, or agency under
        the authenticated user.
      summary: Register Healthcare Organization
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BecomeOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BecomeOrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BecomeOrganizationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          description: Organization registered and pending verification
  /api/v1/accounts/capabilities/:
    get:
      operationId: get_user_capabilities
      description: Returns multi-role capabilities (customer, individual pro, healthcare
        pro, organization owner/member).
      summary: Get User Role Capabilities
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCapabilities'
          description: ''
  /api/v1/accounts/profile/:
    get:
      operationId: get_user_profile
      description: Returns detailed profile information for the authenticated user,
        including role and verification status.
      summary: Retrieve User Profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: update_user_profile
      description: Updates profile details such as name, phone number, and avatar
        image for the authenticated user.
      summary: Update User Profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error
  /api/v1/admin/bookings/{booking_number}/assign/:
    post:
      operationId: assign_booking_worker_admin
      description: Allows platform administrators to assign or reassign a professional
        worker to a booking or override booking status.
      summary: Assign Worker or Override Booking Status
      parameters:
      - in: path
        name: booking_number
        schema:
          type: string
        required: true
      tags:
      - Admin - Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Booking assignment or status updated successfully
  /api/v1/admin/complaints/:
    get:
      operationId: list_complaints_admin
      description: Returns all customer complaints and disputes across the platform
        with optional status filtering.
      summary: List Trust & Safety Complaints
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter by category
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (pending, under_investigation, resolved, rejected,
          closed)
      tags:
      - Admin - Complaints
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminComplaintListList'
          description: ''
  /api/v1/admin/complaints/{complaint_number}/:
    get:
      operationId: retrieve_complaint_admin
      description: Returns full complaint details, booking context, resolution, and
        internal admin notes.
      summary: Retrieve Complaint Dossier
      parameters:
      - in: path
        name: complaint_number
        schema:
          type: string
        required: true
      tags:
      - Admin - Complaints
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComplaintDetail'
          description: ''
  /api/v1/admin/complaints/{complaint_number}/investigate/:
    post:
      operationId: investigate_complaint
      description: Moves a complaint to under-investigation status and records admin
        notes.
      summary: Mark Complaint Under Investigation
      parameters:
      - in: path
        name: complaint_number
        schema:
          type: string
        required: true
      tags:
      - Admin - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComplaintDetail'
          description: ''
  /api/v1/admin/complaints/{complaint_number}/reject/:
    post:
      operationId: reject_complaint
      description: Dismisses/rejects a complaint with a reason.
      summary: Reject Complaint
      parameters:
      - in: path
        name: complaint_number
        schema:
          type: string
        required: true
      tags:
      - Admin - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComplaintDetail'
          description: ''
  /api/v1/admin/complaints/{complaint_number}/resolve/:
    post:
      operationId: resolve_complaint
      description: Marks a complaint as resolved with an official resolution outcome.
      summary: Resolve Complaint
      parameters:
      - in: path
        name: complaint_number
        schema:
          type: string
        required: true
      tags:
      - Admin - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminComplaintActionRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComplaintDetail'
          description: ''
  /api/v1/admin/dashboard/:
    get:
      operationId: get_admin_dashboard_stats
      description: Returns system-wide aggregated metrics, active bookings, total
        revenue, verification queues, and dispute status.
      summary: Retrieve Admin Dashboard Statistics
      tags:
      - Admin - Dashboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: System-wide metrics and dashboard statistics
  /api/v1/admin/financials/overview/:
    get:
      operationId: v1_admin_financials_overview_retrieve
      summary: Platform financial metrics and revenue overview
      tags:
      - Admin - Financials
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFinancialOverview'
          description: ''
  /api/v1/admin/financials/payments/:
    get:
      operationId: v1_admin_financials_payments_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
  /api/v1/admin/financials/payouts/:
    get:
      operationId: v1_admin_financials_payouts_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfessionalPayoutList'
          description: ''
  /api/v1/admin/financials/refunds/:
    get:
      operationId: v1_admin_financials_refunds_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRefundRequestList'
          description: ''
  /api/v1/admin/financials/refunds/{id}/action/:
    post:
      operationId: v1_admin_financials_refunds_action_create
      summary: Approve or reject a refund request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Financials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefundActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminRefundActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminRefundActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequest'
          description: ''
  /api/v1/admin/healthcare/organizations/:
    get:
      operationId: list_healthcare_organizations_admin
      description: Returns all healthcare organizations with verification filter.
      summary: List Healthcare Organizations (Admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin - Healthcare
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminHealthcareOrganizationList'
          description: ''
  /api/v1/admin/healthcare/organizations/{id}/approve/:
    post:
      operationId: approve_healthcare_organization_admin
      description: Approves a healthcare organization and marks it verified.
      summary: Approve Healthcare Organization
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Healthcare
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthcareOrganization'
          description: ''
  /api/v1/admin/healthcare/organizations/{id}/reject/:
    post:
      operationId: reject_healthcare_organization_admin
      description: Rejects a healthcare organization with reason.
      summary: Reject Healthcare Organization
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin - Healthcare
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthcareOrganization'
          description: ''
  /api/v1/admin/healthcare/professionals/:
    get:
      operationId: list_healthcare_professionals_admin
      description: Returns all registered medical practitioners and credentialing
        status.
      summary: List Healthcare Professional Applications (Admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin - Healthcare
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminHealthcareProfessionalList'
          description: ''
  /api/v1/admin/healthcare/professionals/{id}/approve/:
    post:
      operationId: approve_healthcare_professional_admin
      description: Approves a healthcare professional's clinical registration.
      summary: Approve Healthcare Professional License
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Healthcare
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthcareProfessional'
          description: ''
  /api/v1/admin/healthcare/professionals/{id}/reject/:
    post:
      operationId: reject_healthcare_professional_admin
      description: Rejects a healthcare professional's clinical credentials.
      summary: Reject Healthcare Professional License
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Healthcare
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthcareProfessional'
          description: ''
  /api/v1/admin/review-reports/:
    get:
      operationId: list_review_reports_admin
      description: Returns all customer reviews flagged by users for moderation.
      summary: List Flagged Review Reports
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin - Reviews
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminReviewReportList'
          description: ''
  /api/v1/admin/review-reports/{id}/action/:
    post:
      operationId: moderate_review_report
      description: Resolves or dismisses a review report with moderation notes.
      summary: Take Action on Review Report
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewReportActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminReviewReportActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminReviewReportActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReviewReport'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: list_all_users
      description: Returns all registered customer, professional, and staff users.
      summary: List All Users
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Admin - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: retrieve_user_by_admin
      description: Returns account details of a specific user.
      summary: Retrieve User
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this User.
        required: true
      tags:
      - Admin - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: update_user_status_by_admin
      description: Modifies user active status, staff permissions, or basic info.
      summary: Update User Status / Role
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this User.
        required: true
      tags:
      - Admin - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/verifications/:
    get:
      operationId: list_verifications_admin
      description: Returns all professional KYC verification dossiers with optional
        status filter (pending, under_review, approved, rejected, expired, suspended).
      summary: List Professional Verifications
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by professional name or email
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (pending/under_review/approved/rejected/expired/suspended)
      tags:
      - Admin - Verification
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminVerificationListList'
          description: ''
  /api/v1/admin/verifications/{id}/:
    get:
