- name: Complaints
  description: Trust & Safety complaints and dispute filing for customers.
- name: Worker Operations
  description: Professional booking requests, status transitions, and trust score.
- name: Notifications
  description: User in-app notifications and alerts.
- name: Favourites
  description: Customer saved / bookmark services.
- name: Payments - Wallet
  description: Customer and Professional digital wallets, top-up, and immutable ledger
