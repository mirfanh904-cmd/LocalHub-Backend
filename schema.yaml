  description: High-level domain groups (Home Services, Wellness, etc.).
- name: Professionals
  description: Public professional profiles, skills, services, and trust metrics.
- name: Bookings
  description: Customer booking lifecycle, creation, status tracking, and cancellation.
- name: Task Marketplace
  description: Custom task marketplace, bidding, applicant selection, lifecycle, and
