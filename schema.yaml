  description: Multi-method checkout, escrow holding, and idempotency protection.
- name: Payments - Invoices
  description: Official invoices and printable billing documents.
- name: Payments - Refunds
  description: Customer refund filing and tracking.
- name: Payments - Promo
  description: Promotional discount codes and validation engine.
- name: Payments - Professional
  description: Professional net earnings, commissions, and withdrawal payouts.
- name: Admin - Financials
  description: Platform revenue analytics, escrow vault, refund approvals, and payout
